<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>官方周边图鉴 · 王烁然安利站</title>
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/collage.css">
</head>
<body>

<div id="app-header"></div>

<main class="wrap">
  <section class="section">
    <p class="eyebrow" id="page-eyebrow">Goods · 官方周边图鉴</p>
    <h1 style="font-size:clamp(28px,4.5vw,44px)" id="page-title">把心动，一件件收进图鉴</h1>
    <p id="page-sub" style="color:var(--muted);max-width:60ch">
      按系列整理官方周边，标注发售时间、价格与收录状态，方便对照补齐。
    </p>
  </section>

  <section class="section" style="padding-top:20px">
    <div class="filters">
      <span id="catChips" class="cat-chips"></span>
      <input class="search" id="q" type="search" placeholder="搜索周边名称…">
      <span class="chip" id="count"></span>
      <button class="btn btn-sm" id="sortBtn" type="button">时间 · 倒序 ▼</button>
      <button class="btn btn-sm" id="view-btn" style="margin-left:auto">切换为清单视图</button>
    </div>

    <div class="grid grid-4" id="grid"></div>


    <div class="panel" id="table-view" style="display:none;padding:8px 4px">
      <table class="table">
        <thead><tr><th>名称</th><th>系列</th><th>发售时间</th><th>价格</th><th>状态</th><th>备注</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="table-pager" class="pager"></div>
    </div>
    <div class="empty" id="empty" style="display:none">没有找到匹配的周边。</div>
  </section>

  <section class="section wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow">Explore</p>
        <h2>继续浏览其它板块</h2>
      </div>
    </div>
    <div class="grid grid-4" id="sectors"></div>
  </section>
</main>

<div class="footer"><div id="app-footer"></div></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/site.js"></script>
<script>
  Site.init('merch');

  var TABLE_PAGE_SIZE = 5;
  var tablePage = 0;
  var tableAll = [];
  var gridAll = [];
  function renderTable() {
    var total = tableAll.length;
    var totalPages = Math.max(1, Math.ceil(total / TABLE_PAGE_SIZE));
    if (tablePage > totalPages - 1) tablePage = totalPages - 1;
    if (tablePage < 0) tablePage = 0;
    var start = tablePage * TABLE_PAGE_SIZE;
    var slice = tableAll.slice(start, start + TABLE_PAGE_SIZE);
    document.getElementById('tbody').innerHTML = slice.map(function (m) {
      return '<tr><td>' + Site.esc(m.name) + '</td><td>' + m.series + '</td><td>' + m.date +
        '</td><td>' + m.price + '</td><td>' +
        '<span class="chip' + (m.status === '已收录' ? ' on' : '') + '">' + m.status + '</span></td>' +
        '<td style="color:var(--muted)">' + Site.esc(m.note) + '</td></tr>';
    }).join('');
    renderTablePager();
  }
  function renderTablePager() {
    var pager = document.getElementById('table-pager');
    if (!pager) return;
    // 与图鉴视图分页（site.js carousel renderPager）保持一致的隐藏规则：总页数不足一页时隐藏
    var total = Math.ceil(tableAll.length / TABLE_PAGE_SIZE);
    if (total <= 1) { pager.innerHTML = ''; pager.style.display = 'none'; return; }
    pager.style.display = '';
    // 与图鉴视图（site.js carousel renderPager）保持一致的页码按钮隐藏方式：超过窗口时折叠为省略号
    function numBtn(p) {
      return '<button class="pager-num' + (p === tablePage ? ' on' : '') + '" type="button" data-p="' + p + '">' + (p + 1) + '</button>';
    }
    function ellipsis(p) {
      return '<button class="pager-ellipsis" type="button" data-p="' + p + '" aria-label="跳转分页">…</button>';
    }
    var html = '<button class="pager-prev" type="button" aria-label="上一页"' + (tablePage === 0 ? ' disabled' : '') + '>‹ 上一页</button>';
    var WINDOW = 5;
    if (total <= WINDOW) {
      // 不超过 5 页：全部显示
      for (var p = 0; p < total; p++) html += numBtn(p);
    } else {
      // 折叠：首按钮固定第 1 页，尾按钮固定末页，中间 3 页以当前页为中心窗口
      var win;
      if (tablePage <= 2) win = [1, 2, 3];
      else if (tablePage >= total - 3) win = [total - 4, total - 3, total - 2];
      else win = [tablePage - 1, tablePage, tablePage + 1];
      html += numBtn(0);
      if (win[0] > 1) html += ellipsis(Math.max(1, win[0] - 3));
      win.forEach(function (p) { html += numBtn(p); });
      if (win[win.length - 1] < total - 2) html += ellipsis(Math.min(total - 2, win[win.length - 1] + 3));
      html += numBtn(total - 1);
    }
    html += '<button class="pager-next" type="button" aria-label="下一页"' + (tablePage === total - 1 ? ' disabled' : '') + '>下一页 ›</button>';
    pager.innerHTML = html;
  }
  var api = Site.list({
    rootId: 'grid',
    page: 'merch',
    data: MERCH,
    sortKey: 'date',
    noun: '件',
    catKey: 'series',
    catAttr: 'data-series',
    cats: (typeof CATEGORIES !== 'undefined' && CATEGORIES && CATEGORIES.merch)
      ? CATEGORIES.merch.slice() : ['应援', '服饰', '文具', '收藏卡', '生活'],
    search: function (m) { return m.name + m.series + m.note; },
    card: function (m) {
      var src = Site.pic(m.art, 1);
      var on = m.status === '已收录';
      var pics = Site.pics(m.art || {});
      var gal = pics.length > 1 ? '<span class="badge" style="left:auto;right:10px;background:rgba(2,1,0,.78)">图 ' + pics.length + '</span>' : '';
      return '<article class="card reveal" style="cursor:pointer"><div class="thumb halftone" style="aspect-ratio:1/1">' +
        '<img src="' + src + '" alt="' + Site.esc(m.name) + '" loading="lazy" decoding="async">' +
        '<span class="badge" style="' + (on ? 'background:rgba(164,36,35,.92)' : 'background:rgba(2,1,0,.78)') + '">' +
        m.status + '</span>' + gal + '</div>' +
        '<div class="card-body"><h3>' + Site.esc(m.name) + '</h3>' +
        '<p class="meta">' + m.series + ' · ' + m.date + ' · ' + m.price + '</p>' +
        '<p class="desc">' + Site.esc(m.note) + '</p>' +
        (pics.length > 1 ? '<p style="color:#a42423;font-size:12px;margin:6px 0 0">点击查看全部 ' + pics.length + ' 张图 ›</p>' : '') +
        '</div></article>';
    },
    onRows: function (rows) {
      gridAll = rows;
      tableAll = rows;
      tablePage = 0;
      renderTable();
    }
  });

  // 点击卡片打开详情（多图画廊）
  document.getElementById('grid').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var idx = Array.prototype.indexOf.call(this.children, card);
    if (idx < 0 || !gridAll[idx]) return;
    openMerchDetail(gridAll[idx]);
  });

  function openMerchDetail(m) {
    var imgs = Site.pics(m.art || {});
    var info = '<div style="margin-top:6px;text-align:center"><h3 style="margin:0 0 6px">' + Site.esc(m.name) + '</h3>' +
      '<p style="color:#caa;margin:0 0 8px">' + Site.esc(m.series || '') + ' · ' + Site.esc(m.date || '') + ' · ' + Site.esc(m.price || '') + '</p>' +
      (m.note ? '<p style="color:#bbb;font-size:14px;line-height:1.6">' + Site.esc(m.note) + '</p>' : '') +
      (m.status ? '<span class="chip' + (m.status === '已收录' ? ' on' : '') + '">' + Site.esc(m.status) + '</span>' : '') +
      (imgs.length > 1 ? '<p style="color:#999;font-size:12px;margin:10px 0 0">共 ' + imgs.length + ' 张图，点击缩略图切换查看</p>' : '') +
      '</div>';
    Site.galleryModal({ imgs: imgs, alt: m.name, info: info, modalClass: 'merch-detail' });
  }

  document.getElementById('table-pager').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    var total = Math.ceil(tableAll.length / TABLE_PAGE_SIZE);
    if (btn.classList.contains('pager-prev')) tablePage = Math.max(0, tablePage - 1);
    else if (btn.classList.contains('pager-next')) tablePage = Math.min(total - 1, tablePage + 1);
    else if (btn.hasAttribute('data-p')) tablePage = parseInt(btn.getAttribute('data-p'), 10);
    else return;
    renderTable();
  });

  api.state.view = 'grid';
  document.getElementById('view-btn').addEventListener('click', function () {
    api.state.view = api.state.view === 'grid' ? 'list' : 'grid';
    var isGrid = api.state.view === 'grid';
    document.getElementById('grid').style.display = isGrid ? 'grid' : 'none';
    document.getElementById('table-view').style.display = isGrid ? 'none' : 'block';
    this.textContent = isGrid ? '切换为清单视图' : '切换为图鉴视图';
    if (!api.cp) return;
    if (isGrid) { api.cp.showBtn(); api.cp.resume(); } else { api.cp.pause(); api.cp.hideBtn(); }
  });
</script>
<script src="assets/js/cursor.js"></script>
</body>
</html>
